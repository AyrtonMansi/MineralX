name: Operations source checkpoint
on:
  push:
    branches: [codex/operations-suite-20260907]
    paths: [.github/workflows/operations-source-checkpoint.yml]
permissions:
  contents: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Pin server XML parser
        run: npm install --save-exact @xmldom/xmldom@0.9.10 --no-audit --no-fund
      - name: Preserve parser and exact dependency lock
        run: tar -czf /tmp/mineralx-xml-parser.tar.gz node_modules/@xmldom package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: operations-xml-parser
          path: /tmp/mineralx-xml-parser.tar.gz
          retention-days: 7
