name: Verify temporary development access
on:
  push:
    branches: [fix/suite-development-access-20260908]
    paths: [.development-checkpoint/**, .github/workflows/development-access-checkpoint.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  verify:
    if: github.repository == 'AyrtonMansi/MineralX' && github.ref == 'refs/heads/fix/suite-development-access-20260908'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Expand checksum and base-verified source
        run: python3 .development-checkpoint/apply.py
      - name: Preserve normal application source on isolated branch only
        run: |
          git add app components lib scripts tests e2e docs public .gitignore middleware.ts package.json package-lock.json playwright.release.config.js
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          git diff --cached --binary > /tmp/development-source.patch
          rm -r .development-checkpoint
          git add .development-checkpoint
          git config user.name 'AyrtonMansi'
          git config user.email '35603638+AyrtonMansi@users.noreply.github.com'
          git commit -m 'Add isolated no-login Operations development workspace with durable local records'
          git push origin HEAD:refs/heads/fix/suite-development-access-20260908
      - name: Install exact dependencies and generate local-only schema assets
        run: npm ci --no-audit --no-fund
      - name: Typecheck and database regressions
        run: |
          npm run typecheck
          npm run test:ops | tee /tmp/development-ops-tests.log
          npm run test:geology | tee /tmp/development-geology-tests.log
          find tests/gic tests/plant -name '*.test.ts' -print0 | xargs -0 node --import tsx --test | tee /tmp/development-legacy-tests.log
      - name: Production build
        run: npm run build | tee /tmp/development-build.log
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Real browser database and development isolation workflows
        run: npx playwright test --config=playwright.release.config.js
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-access-evidence
          path: |
            /tmp/development-source.patch
            /tmp/development-*.log
            test-results
          retention-days: 7
