name: Operations acceptance
on:
  pull_request:
    paths: ['app/ops/**', 'app/api/ops/**', 'app/api/mcp/**', 'components/ops/**', 'lib/ops/**', 'lib/mcp/**', 'supabase/migrations/**', 'tests/ops/**', 'tests/mcp/**', 'scripts/mcp-smoke.mjs', 'middleware.ts', 'next.config.*', 'package*.json', '.github/workflows/operations-release.yml']
  push:
    branches: [main, implementation/mineralx-operations-integrated-20260907]
permissions:
  contents: read
concurrency:
  group: operations-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ops
      - run: npm run test:unit
      - run: npm run build
