name: Expand and verify consolidated geology source
on:
  push:
    branches: [codex/geology-consolidated-20260907]
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: geology-consolidation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'AyrtonMansi/MineralX' && github.ref == 'refs/heads/codex/geology-consolidated-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify unchanged production base
        run: test "$(git rev-parse origin/main)" = 5827a3f08fd4e227da4734f12c1663b8786140c5
      - name: Verify and expand source checkpoint
        run: python3 .release-checkpoint/apply.py
      - name: Complete qualified element discovery and stable callback dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('components/mineralx/project-store.js')
          s=p.read_text()
          for name in ['s','i']:
              old=f'      Object.keys({name}.detectionLimits || {{}}).forEach(e => set.add(e));'
              assert s.count(old)==1
              s=s.replace(old,old+f'\n      Object.keys({name}.lowerLimits || {{}}).forEach(e => set.add(e));')
          p.write_text(s)
          p=Path('components/mineralx/MineralXWorkspace.jsx')
          s=p.read_text()
          for stmt in ['if (prev) setStore(prev);','if (next) setStore(next);']:
              old=stmt+'\n  }, [store]);'
              assert s.count(old)==1
              s=s.replace(old,stmt+'\n  }, [store, setStore]);')
          p.write_text(s)
          Path('test/geology-element-discovery.test.js').write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import { elementsInStore } from '../components/mineralx/project-store.js';
          test('over-range-only elements remain selectable for surface and drill samples', () => {
            const actual = elementsInStore({ projects: [{
              samples: [{ lowerLimits: { Cu: 10 } }],
              intervals: [{ lowerLimits: { Zn: 5 } }],
            }] });
            assert.ok(actual.includes('Cu'), 'Surface over-range element was hidden');
            assert.ok(actual.includes('Zn'), 'Downhole over-range element was hidden');
            assert.equal(actual.filter(element => element === 'Au').length, 1);
          });
          """)
          PY
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Geology regression tests
        run: npm run test:geology | tee /tmp/geology-unit.log
      - name: Existing operational regression tests
        run: find tests -name '*.test.ts' -print0 | xargs -0 node --import tsx --test | tee /tmp/geology-operational.log
      - name: Production build
        run: npm run build | tee /tmp/geology-build.log
      - name: Production route smoke
        run: |
          set -euo pipefail
          node node_modules/next/dist/bin/next start > /tmp/mineralx-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true; wait "$server_pid" || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:3000/api/mineralx-release > /tmp/release.json; then break; fi
            sleep 1
          done
          for path in / /company /contact /clothing /gic/login /plant /mineralx; do
            curl -fsS "http://localhost:3000$path" > /dev/null
            echo "PASS $path"
          done
          cat /tmp/release.json
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance paths
        run: npx playwright test --config=playwright.release.config.js
      - name: Preserve expanded source patch
        if: always()
        run: |
          git add app components e2e test scripts/verify-geology-production.mjs
          git diff --cached --binary > /tmp/geology-expanded-source.patch
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geology-consolidation-evidence
          path: |
            /tmp/geology-expanded-source.patch
            /tmp/geology-unit.log
            /tmp/geology-operational.log
            /tmp/geology-build.log
            /tmp/mineralx-server.log
            test-results
            playwright-report
          retention-days: 14
      - name: Publish verified application source without changing workflows
        if: success()
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = 5827a3f08fd4e227da4734f12c1663b8786140c5
          # The CI token has contents permission only. Workflow changes are not pushed here.
          git show HEAD:.github/workflows/geology-release.yml > .github/workflows/geology-release.yml
          git add .github/workflows/geology-release.yml
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          rm -r .release-checkpoint
          git add .release-checkpoint
          git diff --cached --check
          git config user.name 'AyrtonMansi'
          git config user.email '35603638+AyrtonMansi@users.noreply.github.com'
          git commit -m 'Consolidate verified geology integrity, custody, review, recovery and field workflows'
          git push origin HEAD:refs/heads/codex/geology-consolidated-20260907
