name: Verify and preserve Operations core
on:
  push:
    branches: [codex/operations-suite-20260907]
    paths: [.operations-checkpoint/**, .github/workflows/operations-core-checkpoint.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  preserve:
    if: github.repository == 'AyrtonMansi/MineralX' && github.ref == 'refs/heads/codex/operations-suite-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source checkpoint
        run: |
          cat .operations-checkpoint/core-{1..5}.xzpart | xz -dc > /tmp/operations-core.patch
          echo 'c5fcfede022919a4ccdf2d8a9174ab3c654e709a60d2f87237e3ee143d245ebf  /tmp/operations-core.patch' | sha256sum -c -
          git apply --check /tmp/operations-core.patch
          git apply /tmp/operations-core.patch
      - run: npm ci --no-audit --no-fund
      - run: npm install --save-exact @xmldom/xmldom@0.9.10 --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit --pretty false
      - name: Isolated Operations database and domain tests
        run: node --import tsx --test tests/ops/*.test.ts | tee /tmp/operations-core-tests.log
      - name: Existing geology and operational regressions
        run: |
          npm run test:geology | tee /tmp/operations-geology-tests.log
          find tests/gic tests/plant -name '*.test.ts' -print0 | xargs -0 node --import tsx --test | tee /tmp/operations-legacy-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operations-core-checkpoint
          path: |
            /tmp/operations-core.patch
            /tmp/operations-*-tests.log
          retention-days: 14
      - name: Preserve verified normal source without workflow writes
        if: success()
        run: |
          git add app/api/ops components/ops lib/ops tests/ops supabase/migrations package.json package-lock.json
          rm -r .operations-checkpoint
          git add .operations-checkpoint
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          git config user.name 'AyrtonMansi'
          git config user.email '35603638+AyrtonMansi@users.noreply.github.com'
          git commit -m 'Preserve tested Operations permissions, gold ledger, geology transactions and authenticated APIs'
          git push origin HEAD:refs/heads/codex/operations-suite-20260907
