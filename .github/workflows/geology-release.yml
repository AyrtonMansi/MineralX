name: Geology release verification
on:
  push:
    branches: [codex/geology-release-20260906]
permissions:
  contents: write
concurrency:
  group: geology-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'AyrtonMansi/MineralX' && github.ref == 'refs/heads/codex/geology-release-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply preserved source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .recovery/geology-part-1.gzpart ]; then
            head -c 6000 .recovery/geology-part-2.gzpart > /tmp/geology-part-2
            cat .recovery/geology-part-2-tail.gzpart >> /tmp/geology-part-2
            test "$(git hash-object /tmp/geology-part-2)" = e6536212c27a364566bd28e10dbc19b282198254
            cat .recovery/geology-part-1.gzpart /tmp/geology-part-2 .recovery/geology-part-3.gzpart .recovery/geology-part-4.gzpart .recovery/geology-part-5.gzpart | gzip -dc > /tmp/geology-release.patch
            echo 'dd3f8e0d09cbbc4729189567119079278fb5c0ffc0e6d5ffe761e3ac96664555  /tmp/geology-release.patch' | sha256sum -c -
            git apply --check /tmp/geology-release.patch
            git apply /tmp/geology-release.patch
          fi
      - name: Install and reconcile combined lockfile
        run: npm install --no-audit --no-fund
      - name: Geology regression tests
        run: npm run test:geology
      - name: Existing operational regression tests
        run: find tests -name '*.test.ts' -print0 | xargs -0 node --import tsx --test
      - name: Production build
        run: npm run build
      - name: Production route smoke
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/mineralx-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:3000/api/mineralx-release > /tmp/release.json; then break; fi
            sleep 1
          done
          for path in / /company /contact /clothing /gic/login /mineralx; do
            curl -fsS "http://localhost:3000$path" > /dev/null
            echo "PASS $path"
          done
          cat /tmp/release.json
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance paths
        run: npx playwright test --config=playwright.release.config.js
      - name: Preserve verification evidence and expanded source
        if: always()
        shell: bash
        run: |
          git ls-files -co --exclude-standard -z | sort -zu | tar --null -T - -czf /tmp/geology-expanded-source.tar.gz
          cp /tmp/mineralx-server.log /tmp/geology-http.log 2>/dev/null || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geology-release-evidence
          path: |
            /tmp/geology-expanded-source.tar.gz
            /tmp/geology-http.log
            test-results
            playwright-report
            package-lock.json
          retention-days: 14
      - name: Commit verified expanded source and lockfile
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .recovery/geology-part-1.gzpart ]; then
            rm .recovery/geology-part-*.gzpart
            git add app components docs e2e test playwright.release.config.js package-lock.json .recovery
            git diff --cached --check
            git config user.name 'AyrtonMansi'
            git config user.email '35603638+AyrtonMansi@users.noreply.github.com'
            git commit -m 'Implement and verify geology field workflows, durable storage, reviewed assays and recovery'
            git push origin HEAD:refs/heads/codex/geology-release-20260906
          fi
